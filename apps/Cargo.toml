[workspace]
resolver = "3"
members = ["smoke-core"]

[workspace.package]
edition = "2024"
version = "0.1.0-alpha.11"
repository = "https://github.com/tcun/build-sandbox"
license = "Proprietary"
rust-version = "1.94"

[profile.dev]
debug = true
incremental = true

[profile.test]
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
