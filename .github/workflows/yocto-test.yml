name: Yocto Canonical Validation

# Automatic PR canonical validation gate.
# This is not strictly required for the dev/test/RC/promotion model to function,
# but it is recommended regression protection for Yocto source-policy + runtime checks.

on:
  pull_request:
    paths:
      - "bsp/yocto/**"
      - "just/**"
      - "infra/runners/github/yocto/**"
      - "apps/**"
      - "Justfile"
      - ".github/workflows/yocto-test.yml"
      - ".github/workflows/release-candidate.yml"
      - ".github/workflows/build-from-ref.yml"
      - ".github/workflows/promote-candidate.yml"

concurrency:
  group: yocto-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  yocto-test:
    name: canonical yocto test gate
    env:
      YOCTO_ROOT: /home/runner/work/yocto-state
      POKY_INIT: ${{ github.workspace }}/build/yocto/sources/poky/oe-init-build-env
    runs-on:
      - self-hosted
      - linux
      - x64
      - yocto

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Guard private key tracking
        run: just ci::guard-no-private-keys

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install kas
        run: pipx install kas

      - name: Validate env contract
        run: just ci::contract-check ci qemux86-64 test

      - name: Run canonical test profile (policy + build + gates)
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: just ci::yocto-test
