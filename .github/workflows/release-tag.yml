name: Release Tag Build

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: validate tag and build
    runs-on:
      - self-hosted
      - linux
      - x64
      - yocto

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kas
        run: pipx install kas

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run release pipeline
        run: just ci::release "${{ github.ref_name }}"

      - name: Publish to artifact server volume
        if: success()
        run: |
          just infra::artifact-publish qemux86-64 release "${{ github.ref_name }}"
          URL="$(just infra::artifact-url release qemux86-64 "${{ github.ref_name }}")"
          {
            echo "### Artifact Publish"
            echo ""
            echo "- Published to podman volume: \`yocto-artifacts\`"
            echo "- URL: ${URL}"
          } >> "$GITHUB_STEP_SUMMARY"
