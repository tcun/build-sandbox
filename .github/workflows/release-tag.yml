name: Release Tag Build

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: validate tag and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kas
        run: pipx install kas

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps -> target

      - name: Run release pipeline
        run: just ci::release "${{ github.ref_name }}"
