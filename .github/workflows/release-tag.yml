name: Release Tag Build

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: validate tag and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kas
        run: pipx install kas

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps -> target

      - name: Run release pipeline
        run: just ci::release "${{ github.ref_name }}"

      - name: Publish to local artifact server volume (best effort)
        if: success()
        continue-on-error: true
        run: |
          if command -v podman >/dev/null 2>&1; then
            just infra::artifact-publish qemux86-64 release "${{ github.ref_name }}"
            URL="$(just infra::artifact-url release qemux86-64 "${{ github.ref_name }}")"
            {
              echo "### Local Artifact Publish"
              echo ""
              echo "- Published to local podman volume: \`yocto-artifacts\`"
              echo "- URL: ${URL}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Podman not available on this runner; skipping local artifact volume publish."
          fi

      - name: Upload release artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}-artifacts
          path: |
            build/yocto/build/qemux86-64-release/tmp/deploy/images/qemux86-64/**
            apps/target/release/smoke-core
          if-no-files-found: error
          retention-days: 14

      - name: Upload Yocto failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}-yocto-logs
          path: |
            build/yocto/build/qemux86-64-release/tmp/work/**/temp/log.do_*
            build/yocto/build/qemux86-64-release/bitbake-cookerdaemon.log
          if-no-files-found: ignore
          retention-days: 7
