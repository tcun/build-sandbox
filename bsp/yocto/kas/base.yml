header:
  version: 14

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    path: build/yocto/sources/poky
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-tcun-buildsandbox:
    path: bsp/yocto/layers/meta-tcun-buildsandbox
    layers:
      .:

env:
  TCUN_VERSION:
  TCUN_BUILD_VERSION:
  TAR_OPTIONS:
  SOURCE_BRANCH:
  SOURCE_REV:
  SMOKE_CORE_EXTERNALSRC:
  GIT_SSH_COMMAND:

local_conf_header:
  common: |
    DL_DIR ?= "${TOPDIR}/../../downloads"
    SSTATE_DIR ?= "${TOPDIR}/../../sstate-cache"
    BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
    PARALLEL_MAKE ?= "-j ${@oe.utils.cpu_count()}"
    BB_ENV_PASSTHROUGH_ADDITIONS:append = " TCUN_VERSION TCUN_BUILD_VERSION TAR_OPTIONS SOURCE_BRANCH SOURCE_REV SMOKE_CORE_EXTERNALSRC GIT_SSH_COMMAND"
