# GitHub Actions Runner Deployment with Podman
#
# This compose file deploys only the Yocto build runner and its caches.
# Artifact serving (Caddy) is managed separately under `infra/services/artifact-server`.
#
# Quick start:
#   1. Create a runner registration token and put it in .env:
#      https://github.com/tcun/build-sandbox/settings/actions/runners/new
#      echo "RUNNER_TOKEN=<your-token>" > .env
#
#   3. Build and start:
#      podman-compose up -d --build
#
#   4. Check logs:
#      podman-compose logs -f
#
# For multiple runners, scale with:
#   podman-compose up -d --scale yocto-runner=3

services:
  yocto-runner:
    build:
      context: .
      dockerfile: Containerfile
      target: ${RUNNER_TARGET:-runner}
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION:-22.04}
        RUNNER_VERSION: ${RUNNER_VERSION:-2.332.0}
        RUST_VERSION: ${RUST_VERSION:-1.94.0}
        KAS_VERSION: ${KAS_VERSION:-4.8}
        INSTALL_RUST_TOOLS: ${INSTALL_RUST_TOOLS:-false}
    image: ${RUNNER_IMAGE:-localhost/yocto-runner:latest}
    container_name: ${RUNNER_CONTAINER_NAME:-yocto-runner}
    hostname: ${RUNNER_HOSTNAME:-yocto-runner-01}
    restart: unless-stopped
    
    # Runner configuration via environment
    environment:
      - RUNNER_REPO=${RUNNER_REPO:-BackburnerLabs/savers-aps}
      - RUNNER_TOKEN=${RUNNER_TOKEN:-}
      - RUNNER_NAME=${RUNNER_NAME:-yocto-runner-01}
      - RUNNER_LABELS=${RUNNER_LABELS:-yocto,kas,rust,self-hosted,linux,x64}
      - RUNNER_GROUP=${RUNNER_GROUP:-Default}
      - RUNNER_RECONFIGURE=${RUNNER_RECONFIGURE:-false}
      - RUNNER_REMOVE_ON_EXIT=${RUNNER_REMOVE_ON_EXIT:-false}
      - YOCTO_FETCH_SSH_KEY=${YOCTO_FETCH_SSH_KEY:-/run/yocto-ssh/yocto_ci}
      # Yocto build parallelism (adjust based on host resources)
      - BB_NUMBER_THREADS=${BB_NUMBER_THREADS:-8}
      - PARALLEL_MAKE=${PARALLEL_MAKE:--j 8}

    # Persistent volumes for build caches
    # These dramatically speed up subsequent builds
    volumes:
      # Yocto download cache (source tarballs, ~20-50GB)
      - yocto-downloads:/cache/downloads:Z
      # Yocto shared state cache (build artifacts, ~50-100GB)
      - yocto-sstate:/cache/sstate-cache:Z
      # Runner work directory (checkout + build, ~100GB+)
      - yocto-workdir:/home/runner/work:Z
      # Shared artifact directory on host (served by separate Caddy stack)
      - ${ARTIFACT_ROOT:-/srv/yocto-artifacts}:/srv/yocto-artifacts:Z,U
      # SSH deploy key for canonical Yocto git fetches
      - ./keys:/run/yocto-ssh:ro,Z

    # Resource limits - Yocto builds are resource-intensive
    # Adjust these based on your host system
    deploy:
      resources:
        limits:
          # Recommend 16GB+ for full image builds
          memory: 32G
        reservations:
          memory: 8G

    # Security: run rootless where possible
    security_opt:
      - label=disable
    
    # Increase ulimits for large builds
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 65536
        hard: 65536

volumes:
  # Named volumes for persistent storage
  yocto-downloads:
    name: yocto-downloads
  yocto-sstate:
    name: yocto-sstate
  yocto-workdir:
    name: yocto-workdir
