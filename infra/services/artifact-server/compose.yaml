# Artifact Server Deployment with Podman
#
# Serves build artifacts from a shared host directory using Caddy.
#
# Quick start:
#   1. Optional: copy `.env.example` to `.env` and adjust values.
#   2. Start:
#      podman-compose up -d

services:
  artifact-server:
    image: docker.io/library/caddy:2-alpine
    container_name: artifact-server
    hostname: artifact-server
    restart: unless-stopped
    ports:
      - "${ARTIFACT_BIND:-0.0.0.0:8080}:80"
    volumes:
      - ${ARTIFACT_ROOT:-/srv/yocto-artifacts}:/srv:ro,Z
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    command: caddy file-server --root /srv --browse --listen :80
